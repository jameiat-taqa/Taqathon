<!--
  TAQATHON - Arabic Gallery Page (gallery.html)
  
  Photo gallery from the closing ceremony.
  Features:
  - Dynamic image loading from gallery.json
  - "Load More" button for progressive loading (24 images per batch)
  - Lightbox modal for full-size image viewing
  - Back-to-top button
  - Image counter display
  - RTL layout support
  
  To customize:
  - Add images to assets/gallery/ folder
  - Update gallery.json with new image filenames
  - Modify BATCH size in JavaScript (default: 24)
  - Adjust image card styling
-->

  <style>
  /* RTL-specific adjustments */
  body{
  font-family: Cairo, Poppins, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
  }
  .btn-lang{
  margin-inline-start:1.25rem;
  }

  /* Page-specific styles */

  /* ===== GALLERY ===== */
  .gallery-card{
  border:none;
  border-radius:1rem;
  overflow:hidden;
  background:#fff;
  box-shadow:0 10px 30px rgba(15,23,42,.08);
  transition:transform .12s ease, box-shadow .12s ease;
  height:100%;
  }
  .gallery-card:hover{
  transform:translateY(-4px);
  box-shadow:0 14px 40px rgba(15,23,42,.16);
  }

  .gallery-img-wrapper{
  position:relative;
  overflow:hidden;
  aspect-ratio:4/3;
  background:#000;
  }

  .gallery-img-wrapper img{
  width:100%;
  height:100%;
  object-fit:cover;
  transition:.3s ease;
  }
  .gallery-card:hover img{ transform:scale(1.05); }

  .gallery-badge{
  position:absolute;
  top:.9rem; right:.9rem;
  background:rgba(0,0,0,.65);
  color:#fff;
  padding:.25rem .7rem;
  border-radius:999px;
  font-size:.75rem;
  }

  .gallery-zoom-icon{
  position:absolute;
  bottom:.9rem; left:.9rem;
  width:2rem; height:2rem;
  border-radius:50%;
  background:rgba(0,0,0,.7);
  color:#fff;
  display:flex;
  justify-content:center;
  align-items:center;
  border:none;
  }

  /* ===== LOAD MORE BUTTON ===== */
  #loadMoreBtn{
  background:var(--brand-blue);
  color:#fff;
  border:none;
  border-radius:.5rem;
  padding:.5rem 1.5rem;
  font-weight:500;
  transition:background .2s ease, transform .2s ease, box-shadow .2s ease;
  box-shadow:0 2px 8px rgba(0,125,253,.2);
  }
  #loadMoreBtn:hover:not(:disabled){
  background:var(--brand-green);
  transform:translateY(-1px);
  box-shadow:0 4px 12px rgba(9,200,153,.3);
  color:#fff;
  }
  #loadMoreBtn:active:not(:disabled){
  transform:translateY(0);
  }
  #loadMoreBtn:disabled{
  background:var(--muted);
  cursor:not-allowed;
  opacity:.7;
  box-shadow:none;
  }

  /* ===== BACK TO TOP BUTTON ===== */
  .back-to-top{
  position:fixed;
  bottom:2rem;
  left:2rem;
  width:3rem;
  height:3rem;
  border-radius:50%;
  background:var(--brand-blue);
  color:#fff;
  border:none;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:1.25rem;
  box-shadow:0 4px 12px rgba(0,125,253,.3);
  cursor:pointer;
  opacity:0;
  visibility:hidden;
  transition:opacity .3s ease, visibility .3s ease, transform .2s ease, background .2s ease;
  z-index:9999;
  pointer-events:none;
  }
  .back-to-top.show{
  opacity:1;
  visibility:visible;
  pointer-events:auto;
  }
  .back-to-top:hover{
  background:var(--brand-green);
  transform:translateY(-2px);
  box-shadow:0 6px 16px rgba(9,200,153,.4);
  }
  .back-to-top:active{
  transform:translateY(0);
  }
  @media (max-width:575.98px){
  .back-to-top{
    bottom:1.5rem;
    left:1.5rem;
    width:2.75rem;
    height:2.75rem;
    font-size:1.1rem;
  }
  }

  .modal-content .btn-close {
  z-index: 5;
  }

  /* ===== FOOTER ===== */
  footer{
  background:var(--brand-dark);
  color:#cfd6df;
  flex-shrink:0;
  }
  footer a{ color:#cfd6df; text-decoration:none; }
  </style>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/common.js"></script>

  <script>
    /**
     * Image Lightbox/Modal
     * Opens full-size image when zoom button is clicked on gallery images.
     * Uses Bootstrap modal component.
     */
    const zoomModal = document.getElementById('zoomModal');
    const zoomImage = document.getElementById('zoomImage');
    if (zoomModal && zoomImage) {
      // When modal opens, load the full-size image
      zoomModal.addEventListener('show.bs.modal', (event) => {
        const button = event.relatedTarget;  // Button that triggered the modal
        if (button) {
          zoomImage.src = button.getAttribute('data-full') || '';  // Get image path from data-full attribute
        }
      });
      // Clear image when modal closes (saves memory)
      zoomModal.addEventListener('hidden.bs.modal', () => {
        zoomImage.src = '';
      });
    }


    /**
     * Back to Top Button
     * Shows/hides a floating button that scrolls to top when clicked.
     */
    const backToTopBtn = document.getElementById('backToTop');
    if (backToTopBtn) {
      /**
       * Checks scroll position and shows/hides the back-to-top button
       * Button appears after scrolling 200px down
       */
      function checkScroll() {
        // Get scroll position (works with body as scroll container)
        const scrollTop = document.body.scrollTop || document.documentElement.scrollTop || window.pageYOffset || 0;
        if (scrollTop > 200) {
          backToTopBtn.classList.add('show');  // Show button
        } else {
          backToTopBtn.classList.remove('show');  // Hide button
        }
      }

      // Listen for scroll events (body has overflow:auto, so listen to both)
      document.body.addEventListener('scroll', checkScroll, { passive: true });
      window.addEventListener('scroll', checkScroll, { passive: true });
      window.addEventListener('load', checkScroll);  // Check after page loads
      checkScroll();  // Check immediately
      setTimeout(checkScroll, 100);   // Check after short delay
      setTimeout(checkScroll, 500);  // Check after images load
      setInterval(checkScroll, 100);  // Periodic check (fallback if events don't fire)

      // Smooth scroll to top when button is clicked
      backToTopBtn.addEventListener('click', (e) => {
        e.preventDefault();
        document.body.scrollTo({
          top: 0,
          behavior: 'smooth'
        });
        document.documentElement.scrollTo({
          top: 0,
          behavior: 'smooth'
        });
      });
    }
  </script>
<script>
  /**
   * Gallery Image Loader
   * Dynamically loads gallery images from JSON file with "Load More" functionality.
   * 
   * How it works:
   * - Fetches gallery.json which contains array of image filenames
   * - Loads images in batches (24 at a time) for better performance
   * - Each image card has a zoom button that opens full-size image in modal
   * - Updates counter showing "X of Y" images displayed
   * - Handles image load errors gracefully (removes broken images)
   * 
   * JSON format expected (gallery.json):
   * ["image1.jpg", "image2.jpg", ...]
   * 
   * To add images:
   * 1. Add image files to assets/gallery/ folder
   * 2. Add filename to gallery.json array
   * 
   * To change batch size: Modify BATCH constant below
   */
  (function () {
    const grid = document.getElementById('galleryGrid');
    const btn = document.getElementById('loadMoreBtn');
    const shownEl = document.getElementById('shownCount');
    const totalEl = document.getElementById('totalCount');

    if (!grid || !btn || !shownEl || !totalEl) return;

    const BATCH = 24; // Number of images to load per "Load More" click
    let files = [];   // Array of image filenames from JSON
    let index = 0;    // Current position in files array

    /**
     * Updates the counter display and button state
     */
    function updateCounts() {
      shownEl.textContent = String(Math.min(index, files.length));
      totalEl.textContent = String(files.length);
      btn.disabled = index >= files.length;  // Disable when all images loaded
      btn.textContent = btn.disabled ? 'تم التحميل بالكامل' : 'تحميل المزيد';
    }

    /**
     * Renders the next batch of images
     * Creates image cards and appends them to the gallery grid
     */
    function renderBatch() {
      const slice = files.slice(index, index + BATCH);  // Get next batch
      index += slice.length;  // Update position

    const frag = document.createDocumentFragment();

    slice.forEach((name) => {
      const path = `assets/gallery/${name}`;

      const col = document.createElement('div');
      col.className = 'col-sm-6 col-lg-4';
      col.innerHTML = `
        <div class="gallery-card">
          <div class="gallery-img-wrapper">
            <img
              src="${path}"
              alt="طاقثون الحفل الختامي"
              loading="lazy"
              decoding="async"
            >
            <button class="gallery-zoom-icon"
              data-bs-toggle="modal"
              data-bs-target="#zoomModal"
              data-full="${path}">
              <i class="bi bi-arrows-fullscreen"></i>
            </button>
          </div>
        </div>
      `;

      // Error handling: Remove card if image fails to load (prevents broken image display)
      const img = col.querySelector('img');
      img.addEventListener('error', () => col.remove());

      frag.appendChild(col);
    });

    // Append all cards to DOM at once for better performance
    grid.appendChild(frag);
    updateCounts();
  }

    // Load image list from JSON file
    fetch('gallery.json')
      .then(r => {
        if (!r.ok) throw new Error(`HTTP error! status: ${r.status}`);
        return r.json();
      })
      .then((data) => {
        files = Array.isArray(data) ? data : [];  // Ensure we have an array
        index = 0;
        updateCounts();
        renderBatch(); // Load initial batch immediately
      })
      .catch((error) => {
        // Show error message if gallery.json can't be loaded
        console.error('Error loading gallery.json:', error);
        if (grid) {
          grid.innerHTML = '<div class="col-12"><p class="text-center text-danger">خطأ في تحميل الصور. يرجى تحديث الصفحة.</p></div>';
        }
      });

    // Load more images when button is clicked
    btn.addEventListener('click', renderBatch);
  })();
</script>

  <!-- BACK TO TOP BUTTON -->
  <button class="back-to-top" id="backToTop" aria-label="العودة للأعلى">
