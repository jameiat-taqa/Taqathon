<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gallery</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet">

  <!-- Bootstrap LTR + Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

  <style>
    :root{
      --brand-blue:#007DFD;
      --brand-green:#09C899;
      --brand-dark:#00284C;
      --brand-grad: linear-gradient(90deg, var(--brand-green), var(--brand-blue));
      --text:#1d2733;
      --muted:#66768a;
    }

    html, body {
      margin: 0;
      padding: 0;
      font-family: Poppins, Cairo, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      color: var(--text);
      background: #f8fbfd;
      overflow-x: clip;
    }

    html { overflow: hidden; }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: auto;
      scrollbar-width: none;
    }

    /* THIS makes the footer stick */
    main {
      flex: 1 0 auto;
    }

    body::-webkit-scrollbar { width:0; height:0; }
    *, *::before, *::after { box-sizing: border-box; }
    img, svg, canvas, video, iframe { max-width: 100%; height: auto; display: block; }

    .text-secondary{ color:var(--muted)!important; }

    /* ===== NAVBAR (exact match to submissions/rules) ===== */
    .navbar{
      background:#fff;
      box-shadow:0 2px 10px rgba(0,0,0,.04);
      padding-top:.4rem; padding-bottom:.4rem;
    }
    .logo-mark{ height:60px; width:auto; object-fit:contain; }
    .assoc-logo{ height:48px; width:auto; object-fit:contain; }
    .navbar-nav .nav-link{ font-weight:500; color:var(--brand-dark); transition:.2s; }
    .navbar-nav .nav-link:hover,
    .navbar-nav .nav-link.active{ color:var(--brand-blue); }

    .btn-lang{
      background:var(--brand-blue); color:#ffffff !important;
      border:none; border-radius:.4rem;
      padding:.35rem .9rem; font-weight:500; transition:.2s;
    }
    .btn-lang:hover{ background:var(--brand-green); color:#fff !important; }

    .navbar .container{ position:relative; flex-wrap:nowrap; }
    .navbar .navbar-brand,
    .navbar .assoc-fixed{ flex-shrink:0; }
    @media (max-width:991.98px){
      .navbar .navbar-collapse{
        position:absolute; inset-inline:0; top:100%;
        background:#fff; padding:.75rem 1rem;
        border-top:1px solid #e9eef5;
        box-shadow:0 10px 24px rgba(0,0,0,.08);
        z-index:1000;
      }
      .logo-mark{ height:44px; } .assoc-logo{ height:32px; }
    }

    /* ===== ICON CIRCLE ===== */
    .icon-circle{
      width:64px;
      height:64px;
      border-radius:999px;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      background:linear-gradient(180deg,#eef6ff,#f3fbff);
      border:1px solid #c9ddff;
      color:var(--brand-blue);
      box-shadow:0 4px 16px rgba(0,125,253,.25);
      font-size:1.6rem;
    }

    /* ===== GALLERY ===== */
    .gallery-card{
      border:none;
      border-radius:1rem;
      overflow:hidden;
      background:#fff;
      box-shadow:0 10px 30px rgba(15,23,42,.08);
      transition:transform .12s ease, box-shadow .12s ease;
      height:100%;
    }

    .gallery-card:hover{
      transform:translateY(-4px);
      box-shadow:0 14px 40px rgba(15,23,42,.16);
    }

    .gallery-img-wrapper{
      position:relative;
      overflow:hidden;
      aspect-ratio:4/3;
      background:#000;
    }

    .gallery-img-wrapper img{
      width:100%;
      height:100%;
      object-fit:cover;
      transition:.3s ease;
    }

    .gallery-card:hover img{ transform:scale(1.05); }

    .gallery-badge{
      position:absolute;
      top:.9rem; left:.9rem;
      background:rgba(0,0,0,.65);
      color:#fff;
      padding:.25rem .7rem;
      border-radius:999px;
      font-size:.75rem;
    }

    .gallery-zoom-icon{
      position:absolute;
      bottom:.9rem; right:.9rem;
      width:2rem; height:2rem;
      border-radius:50%;
      background:rgba(0,0,0,.7);
      color:#fff;
      display:flex;
      justify-content:center;
      align-items:center;
      border:none;
    }

    /* ===== BACK TO TOP BUTTON ===== */
    .back-to-top{
      position:fixed;
      bottom:2rem;
      right:2rem;
      width:3rem;
      height:3rem;
      border-radius:50%;
      background:var(--brand-blue);
      color:#fff;
      border:none;
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:1.25rem;
      box-shadow:0 4px 12px rgba(0,125,253,.3);
      cursor:pointer;
      opacity:0;
      visibility:hidden;
      transition:opacity .3s ease, visibility .3s ease, transform .2s ease, background .2s ease;
      z-index:9999;
      pointer-events:none;
    }
    .back-to-top.show{
      opacity:1;
      visibility:visible;
      pointer-events:auto;
    }
    .back-to-top:hover{
      background:var(--brand-green);
      transform:translateY(-2px);
      box-shadow:0 6px 16px rgba(9,200,153,.4);
    }
    .back-to-top:active{
      transform:translateY(0);
    }
    @media (max-width:575.98px){
      .back-to-top{
        bottom:1.5rem;
        right:1.5rem;
        width:2.75rem;
        height:2.75rem;
        font-size:1.1rem;
      }
    }

    /* ===== LOAD MORE BUTTON ===== */
    #loadMoreBtn{
      background:var(--brand-blue);
      color:#fff;
      border:none;
      border-radius:.5rem;
      padding:.5rem 1.5rem;
      font-weight:500;
      transition:background .2s ease, transform .2s ease, box-shadow .2s ease;
      box-shadow:0 2px 8px rgba(0,125,253,.2);
    }
    #loadMoreBtn:hover:not(:disabled){
      background:var(--brand-green);
      transform:translateY(-1px);
      box-shadow:0 4px 12px rgba(9,200,153,.3);
      color:#fff;
    }
    #loadMoreBtn:active:not(:disabled){
      transform:translateY(0);
    }
    #loadMoreBtn:disabled{
      background:var(--muted);
      cursor:not-allowed;
      opacity:.7;
      box-shadow:none;
    }

    /* ===== FOOTER ===== */
    footer{
      background:var(--brand-dark);
      color:#cfd6df;
      margin-top:auto;
    }
    footer a{ color:#cfd6df; text-decoration:none; }
/* ===== Global / Edge + Scrollbar fix (non-destructive) ===== */
    html, body {
      margin: 0;
      padding: 0;
      font-family: Poppins, Cairo, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      color: var(--text);
      background: #f8fbfd;
      overflow-x: clip;               /* stop tiny right-edge line */
    }
    html { overflow: hidden; }        /* hide OS scrollbar track */
    body {
      height: 100vh;                  /* body becomes scroller */
      overflow: auto;                 /* keep scrolling */
      scrollbar-width: none;          /* Firefox: hide bar */
    }
    body::-webkit-scrollbar {         /* Chrome/Edge/Safari: hide bar */
      width: 0;
      height: 0;
    }
  </style>
</head>

<body>

  <!-- ===== NAVBAR ===== -->
  <nav class="navbar navbar-expand-lg navbar-light sticky-top">
    <div class="container d-flex align-items-center justify-content-between">
      <!-- Left: Taqathon logo -->
      <a class="navbar-brand d-flex align-items-center" href="index-en.html" aria-label="Taqathon home">
        <img src="assets/taqathon-logo.png" alt="Taqathon logo" class="logo-mark">
      </a>

      <!-- Center: links -->
      <div class="collapse navbar-collapse justify-content-lg-center" id="mainNav">
        <ul class="navbar-nav mb-2 mb-lg-0 align-items-lg-center">
          <li class="nav-item"><a class="nav-link" href="index-en.html">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="contract-en.html">Contract</a></li>
          <li class="nav-item"><a class="nav-link" href="schedule-en.html">Schedule &amp; Workshops</a></li>
          <li class="nav-item"><a class="nav-link" href="submissions-en.html">Submissions</a></li>
          <li class="nav-item"><a class="nav-link" href="rules-en.html">Rules &amp; Resources</a></li>
          <li class="nav-item"><a class="nav-link active" href="gallery-en.html">Gallery</a></li>
          <li class="nav-item"><a class="nav-link" href="contact-en.html">Contact Us</a></li>
          <li class="nav-item ms-3">
            <a class="btn btn-sm btn-lang" href="gallery.html">AR</a>
          </li>
        </ul>
      </div>

      <!-- Right: Association logo + burger -->
      <div class="assoc-fixed d-flex align-items-center gap-2">
        <a href="https://taqa.org.sa" target="_blank" rel="noopener" class="d-block" aria-label="Energy Association for Sustainable Development">
          <img src="assets/association-logo.png" alt="Energy Association for Sustainable Development" class="assoc-logo">
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav"
                aria-controls="mainNav" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
      </div>
    </div>
  </nav>


  <!-- ===== MAIN CONTENT ===== -->
  <main class="py-5">
    <div class="container">

      <!-- Page header -->
      <div class="text-center mb-5">
        <div class="icon-circle mx-auto mb-3">
          <i class="bi bi-images"></i>
        </div>
        <h5 class="mb-1 fw-semibold">Closing Ceremony Gallery</h5>
        <div style="height: 20px;"></div>
      </div>


      <!-- GALLERY -->
      <div class="row g-4" id="galleryGrid"></div>

      <div class="d-flex flex-column flex-sm-row align-items-center justify-content-between gap-2 mt-4">
        <div class="small text-secondary">
          Showing <span id="shownCount">0</span> of <span id="totalCount">0</span>
        </div>
        <button class="btn btn-primary btn-sm px-4" id="loadMoreBtn" type="button">
          Load more
        </button>
      </div>
    </div>
  </main>


  <!-- ===== LIGHTBOX MODAL ===== -->
  <div class="modal fade" id="zoomModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-xl">
      <div class="modal-content bg-black border-0 position-relative">
        <button class="btn-close btn-close-white position-absolute top-0 end-0 m-3"
                data-bs-dismiss="modal" aria-label="Close"></button>
        <img id="zoomImage" class="w-100" src="" alt="Full-size image">
      </div>
    </div>
  </div>


  <!-- ===== FOOTER ===== -->
  <footer class="pt-5">
    <div class="container">
      <div class="row g-4">
        <div class="col-md-6">
          <h6 class="mb-3 text-white">Taqathon</h6>
          <p class="small mb-1">Organized by Energy Association for Sustainable Development</p>
        </div>
        <div class="col-md-6">
          <h6 class="mb-3 text-white">Follow Us</h6>
          <div class="d-flex gap-3">
            <a href="https://x.com/jameiat_taqa" target="_blank" rel="noopener" class="text-light"><i class="bi bi-twitter-x fs-5"></i></a>
            <a href="https://instagram.com/jameiat_taqa" target="_blank" rel="noopener" class="text-light"><i class="bi bi-instagram fs-5"></i></a>
            <a href="https://www.linkedin.com/company/جمعية-الطاقة-للتنمية-المستدامة" target="_blank" rel="noopener" class="text-light"><i class="bi bi-linkedin fs-5"></i></a>
            <a href="https://tiktok.com/@jameiat_taqa" target="_blank" rel="noopener" class="text-light"><i class="bi bi-tiktok fs-5"></i></a>
          </div>
        </div>
      </div>

      <div class="border-top border-secondary mt-4 pt-3 pb-4 small text-center">
        © <span id="year"></span> Taqathon. All rights reserved.
      </div>
    </div>
  </footer>

  <!-- ===== BACK TO TOP BUTTON ===== -->
  <button class="back-to-top" id="backToTop" aria-label="Back to top">
    <i class="bi bi-arrow-up"></i>
  </button>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    // Lightbox
    const zoomModal = document.getElementById('zoomModal');
    const zoomImage = document.getElementById('zoomImage');
    if (zoomModal && zoomImage) {
      zoomModal.addEventListener('show.bs.modal', (event) => {
        const button = event.relatedTarget;
        if (button) {
          zoomImage.src = button.getAttribute('data-full') || '';
        }
      });
      zoomModal.addEventListener('hidden.bs.modal', () => {
        zoomImage.src = '';
      });
    }

    // Footer year
    const y = document.getElementById('year');
    if (y) y.textContent = new Date().getFullYear();

    // Back to top button
    const backToTopBtn = document.getElementById('backToTop');
    if (backToTopBtn) {
      // Function to check scroll position - body is the scroll container
      function checkScroll() {
        const scrollTop = document.body.scrollTop || document.documentElement.scrollTop || window.pageYOffset || 0;
        if (scrollTop > 200) {
          backToTopBtn.classList.add('show');
        } else {
          backToTopBtn.classList.remove('show');
        }
      }

      // Show/hide button based on scroll position
      // Listen to body scroll since body has overflow:auto
      document.body.addEventListener('scroll', checkScroll, { passive: true });
      window.addEventListener('scroll', checkScroll, { passive: true });
      // Also check on load and after images load
      window.addEventListener('load', checkScroll);
      setTimeout(checkScroll, 500); // Check after a short delay
      
      // Check periodically in case scroll events aren't firing
      setInterval(checkScroll, 100);

      // Smooth scroll to top on click
      backToTopBtn.addEventListener('click', (e) => {
        e.preventDefault();
        document.body.scrollTo({
          top: 0,
          behavior: 'smooth'
        });
        document.documentElement.scrollTo({
          top: 0,
          behavior: 'smooth'
        });
      });
    }
  </script>
<script>
  (function () {
    const grid = document.getElementById('galleryGrid');
    const btn = document.getElementById('loadMoreBtn');
    const shownEl = document.getElementById('shownCount');
    const totalEl = document.getElementById('totalCount');

    if (!grid || !btn || !shownEl || !totalEl) return;

    const BATCH = 24; // 24 per click (fast + smooth)
    let files = [];
    let index = 0;

    function updateCounts() {
      shownEl.textContent = String(Math.min(index, files.length));
      totalEl.textContent = String(files.length);
      btn.disabled = index >= files.length;
      btn.textContent = btn.disabled ? 'All loaded' : 'Load more';
    }

    function renderBatch() {
      const slice = files.slice(index, index + BATCH);
      index += slice.length;

      const frag = document.createDocumentFragment();

      slice.forEach((name) => {
        const path = `assets/gallery/${name}`;

        const col = document.createElement('div');
        col.className = 'col-sm-6 col-lg-4';
        col.innerHTML = `
          <div class="gallery-card">
            <div class="gallery-img-wrapper">
              <img
                src="${path}"
                alt="Taqathon Closing Ceremony"
                loading="lazy"
                decoding="async"
              >
              <button class="gallery-zoom-icon"
                data-bs-toggle="modal"
                data-bs-target="#zoomModal"
                data-full="${path}">
                <i class="bi bi-arrows-fullscreen"></i>
              </button>
            </div>
          </div>
        `;

        // If an image fails, remove the card (prevents black boxes)
        const img = col.querySelector('img');
        img.addEventListener('error', () => col.remove());

        frag.appendChild(col);
      });

      // Append to DOM immediately
      grid.appendChild(frag);
      updateCounts();
    }

    fetch('gallery.json')
      .then(r => {
        if (!r.ok) throw new Error(`HTTP error! status: ${r.status}`);
        return r.json();
      })
      .then((data) => {
        files = Array.isArray(data) ? data : [];
        index = 0;
        updateCounts();
        renderBatch(); // initial batch
      })
      .catch((error) => {
        console.error('Error loading gallery.json:', error);
        if (grid) {
          grid.innerHTML = '<div class="col-12"><p class="text-center text-danger">Error loading gallery images. Please refresh the page.</p></div>';
        }
      });

    btn.addEventListener('click', renderBatch);
  })();
</script>
  
</body>
</html>
