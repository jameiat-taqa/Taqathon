name: Build and Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deploy at a time; don't cancel one that's already running.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - run: npx eleventy

      # Most pages haven't been migrated to Eleventy yet (Phase 0 covers Home only).
      # Copy everything still hand-written, plus the shared static assets/data,
      # into the build output alongside the generated index.html / index-en.html.
      - name: Copy not-yet-migrated pages and static assets
        run: |
          cp -r assets _site/assets
          cp announcements.json announcements-ar.json gallery.json _site/
          cp contract.html contract-en.html _site/
          cp contact.html contact-en.html _site/
          cp gallery.html gallery-en.html _site/
          cp rules.html rules-en.html _site/
          cp schedule.html schedule-en.html _site/
          cp submissions.html submissions-en.html _site/
          cp verify.html _site/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
